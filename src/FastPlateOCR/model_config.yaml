# model_config.yaml - Configuración MÍNIMA que debería funcionar
model_type: 'cct'

# Rescaling de imagen
rescaling:
  scale: 0.00392156862745098  # 1/255
  offset: 0.0

# Tokenizer - AHORA INCLUIDO
tokenizer:
  blocks:
    - layer: 'Conv2D'
      filters: 64
      kernel_size: 3
      strides: 2
      padding: 'same'
      activation: 'gelu'
    - layer: 'Conv2D'
      filters: 128
      kernel_size: 3
      strides: 2
      padding: 'same'
      activation: 'gelu'
    - layer: 'Conv2D'
      filters: 256
      kernel_size: 3
      strides: 2
      padding: 'same'
      activation: 'gelu'
  dropout_rate: 0.1

# Transformer Encoder - AHORA INCLUIDO
transformer_encoder:
  layers: 6
  heads: 8
  projection_dim: 256
  units: [512, 512, 512, 512, 512, 256]
  dropout_rate: 0.1
  attention_dropout_rate: 0.1

# Clasificador
classifier:
  dropout_rate: 0.2
  use_global_pooling: true

# Parámetros globales
input_shape: [70, 140, 3]
label_smoothing: 0.01