# Configuración para matrículas mexicanas (ej. ABC-123 o ABC123)

# Número máximo de caracteres en la matrícula (incluyendo el guión si lo usas).
# Ejemplo: ABC-123 son 7 caracteres. Si no usas guión, serían 6.
max_plate_slots: 9

# Todos los caracteres posibles que puede tener tu matrícula.
# Incluye números, letras y el guión si aplica.
alphabet: '0123456789ABCDEFGHJKLMNPRSTUVWXYZ-'

# Carácter de relleno para matrículas más cortas. Debe estar en el 'alphabet'.
pad_char: '-'

# Dimensiones de la imagen de entrada. DEBEN coincidir con las que usaste en tu script de redimensionamiento (140x70).
img_height: 70
img_width: 140

# Mantener la relación de aspecto (recomendado False si ya redimensionaste).
keep_aspect_ratio: false

# Método de interpolación para el redimensionamiento.
interpolation: 'area'

# Modo de color de la imagen. 'rgb' para 3 canales, 'grayscale' para 1 canal.
image_color_mode: 'rgb'